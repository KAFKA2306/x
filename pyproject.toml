[project]
name = "twitter-analysis"
version = "0.1.0"
description = "Twitter Data Analysis Tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "pydantic",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
