<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
        <canvas id="followChart" height="180"></canvas>
    </div>
    <div class="grid grid-cols-3 gap-3">
        <div class="bg-dark-700/50 rounded-xl p-4 text-center">
            <p class="text-3xl font-bold text-rose-400">{{ graph.stats.non_followers_count }}</p>
            <p class="text-xs text-gray-400 mt-1">Not Following Back</p>
        </div>
        <div class="bg-dark-700/50 rounded-xl p-4 text-center">
            <p class="text-3xl font-bold text-emerald-400">{{ graph.stats.fans_count }}</p>
            <p class="text-xs text-gray-400 mt-1">Fans</p>
        </div>
        <div class="bg-dark-700/50 rounded-xl p-4 text-center">
            <p class="text-3xl font-bold text-sky-400">{{ graph.stats.mutuals_count }}</p>
            <p class="text-xs text-gray-400 mt-1">Mutuals</p>
        </div>
    </div>
</div>

<script>
    new Chart(document.getElementById('followChart'), {
        type: 'doughnut',
        data: {
            labels: ['Followers', 'Following'],
            datasets: [{
                data: [{{ graph.stats.total_followers }}, {{ graph.stats.total_following }}],
        backgroundColor: ['#6366f1', '#8b5cf6'],
        borderWidth: 0,
        cutout: '70%'
    }]
    },
        options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { position: 'bottom', labels: { color: '#9ca3af', padding: 16 } }
        }
    }
});
</script>
