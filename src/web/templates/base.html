<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Analytics Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #0f0f23, #1a1a3e, #0f2027, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            }

            50% {
                box-shadow: 0 0 40px rgba(99, 102, 241, 0.6), 0 0 60px rgba(139, 92, 246, 0.3);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .glass:hover {
            transform: translateY(-4px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(99, 102, 241, 0.2);
        }

        .card-glow {
            animation: pulse-glow 3s ease-in-out infinite;
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899, #6366f1);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }

        .card {
            background: rgba(30, 30, 40, 0.8);
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
        }

        .stat-box {
            background: rgba(50, 50, 60, 0.5);
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
        }

        .stat-box .label {
            display: block;
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .stat-box .value {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
        }

        .badge {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            box-shadow: 0 2px 10px rgba(79, 70, 229, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 0.5rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #9ca3af;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .stat-number {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .stat-number:hover {
            transform: scale(1.1);
        }

        a {
            transition: all 0.3s ease;
        }

        a:hover {
            filter: brightness(1.2);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6366f1, #8b5cf6);
            border-radius: 4px;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0f0f23', 800: '#1a1a2e', 700: '#252542' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gradient-to-br from-dark-900 via-dark-800 to-dark-900 text-gray-100 min-h-screen">
    <div class="container mx-auto p-6 max-w-7xl">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
