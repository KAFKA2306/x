input_file: "data/tweets.js"
output_dir: "output"
model_name: "gemini-2.5-flash"
preset: "default"

files:
  tweets: "data/tweets.js"
  follower: "data/follower.js"
  following: "data/following.js"
  like: "data/like.js"

vrchat_keywords:
  - "vrchat"
  - "vrc"
  - "ワールド"
  - "アバター"
  - "avatar"
  - "world"

photo_keywords:
  - "写真"
  - "photo"
  - "撮影"
  - "📷"
  - "📸"
  - "撮った"

weights:
  follower: 10
  reply: 3
  retweet: 1
  mention: 2
  like: 2
  quote: 4

limits:
  tfidf_features: 20
  word_freq: 100
  top_stats: 10
  top_interests: 20
  mutuals: 20

