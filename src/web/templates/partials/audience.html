<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
        <h3 class="text-sm font-semibold text-violet-400 uppercase tracking-wide mb-3">Top Replied To</h3>
        <div class="space-y-2">
            {% for user, count in stats.top_replied[:5] %}
            <div class="flex items-center justify-between bg-dark-700/50 rounded-lg px-3 py-2">
                <span class="text-gray-200 font-medium">@{{ user }}</span>
                <span class="text-violet-400 font-mono text-sm">{{ count }}</span>
            </div>
            {% else %}
            <p class="text-gray-500 text-sm">No replies found</p>
            {% endfor %}
        </div>
    </div>
    <div>
        <h3 class="text-sm font-semibold text-emerald-400 uppercase tracking-wide mb-3">Top Retweeted</h3>
        <div class="space-y-2">
            {% for user, count in stats.top_retweeted[:5] %}
            <div class="flex items-center justify-between bg-dark-700/50 rounded-lg px-3 py-2">
                <span class="text-gray-200 font-medium">@{{ user }}</span>
                <span class="text-emerald-400 font-mono text-sm">{{ count }}</span>
            </div>
            {% else %}
            <p class="text-gray-500 text-sm">No retweets found</p>
            {% endfor %}
        </div>
    </div>
</div>
