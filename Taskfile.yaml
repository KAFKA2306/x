version: '3'

tasks:
  lint:
    cmds: [uv run ruff check . --fix]

  format:
    cmds: [uv run ruff format .]

  serve:
    aliases: [dev]
    cmds: [uv run uvicorn src.web.app:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-dir data]

  up:
    aliases: [docker-up]
    cmds: [docker compose up --build]

  down:
    aliases: [docker-down]
    cmds: [docker compose down]

  tunnel:
    cmds: [ssh -R 80:localhost:80 serveo.net]
